    <path d="M10 32H54M10 32L15 27M10 32L15 37M54 32L49 27M54 32L49 37"/>
  </g>
  
  <!-- Four Evangelist Dots in Quadrants -->
  <circle cx="21" cy="21" r="2.5" fill="#F59E0B"/>
  <circle cx="43" cy="21" r="2.5" fill="#F59E0B"/>
  <circle cx="21" cy="43" r="2.5" fill="#F59E0B"/>
  <circle cx="43" cy="43" r="2.5" fill="#F59E0B"/>
